name: Publish v1.0.0 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 EndSteamEndStream.bat \
            --title "End Steam End Stream v1.0.0" \
            --notes-file RELEASE_NOTES.md \
            --target main
